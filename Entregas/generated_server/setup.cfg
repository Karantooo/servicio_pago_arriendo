[metadata]
name = entregas_api
version = 1.0.0
description = API REST para agendar y registrar la entrega de los arriendos. La entrega es un **retiro en tienda**: el cliente va a buscar el equipo en la fecha agendada y, cuando lo retira, la entrega se marca como entregada.
long_description = file: README.md
keywords = OpenAPI API Entregas ArriendaPro
python_requires = >= 3.11.*
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11

[options]
install_requires =
    fastapi>=0.110.0
    uvicorn[standard]>=0.28.0
    pydantic>=2.6.0
    sqlalchemy>=2.0.28
    psycopg2-binary>=2.9.9
    httpx>=0.27,<1
setup_requires = setuptools
package_dir = =src
packages = find_namespace:

[options.packages.find]
where = src

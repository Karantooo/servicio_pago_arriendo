services:
  gateway:
    image: krakend:latest
    ports:
      - "${KRAKEND_PORT:-8080}:8080"
    volumes:
      - ./krakend.json:/etc/krakend/krakend.json:ro
      - ./jwk-symmetric.json:/etc/krakend/jwk-symmetric.json:ro
    command: ["run", "-d", "-c", "/etc/krakend/krakend.json"]
    depends_on:
      - mock-profile
      - mock-rentals

  mock-profile:
    build:
      context: .
      dockerfile: Dockerfile.mock
    environment:
      SERVICE_NAME: profile

  mock-rentals:
    build:
      context: .
      dockerfile: Dockerfile.mock
    environment:
      SERVICE_NAME: rentals

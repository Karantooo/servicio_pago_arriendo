services:
  gateway:
    image: krakend:latest
    restart: always
    ports:
      - "${KRAKEND_PORT:-8080}:8080"
    volumes:
      - ./api_gateway/krakend.json:/etc/krakend/krakend.json:ro
      - ./api_gateway/jwk-symmetric.json:/etc/krakend/jwk-symmetric.json:ro
    command: ["run", "-d", "-c", "/etc/krakend/krakend.json"]
    depends_on:
      arriendos-api:
        condition: service_healthy
      entregas-api:
        condition: service_healthy
      payments-api:
        condition: service_healthy

  equipos-api:
    build:
      context: ./Equipos
      dockerfile: Dockerfile
      target: base

    env_file:
      - .env

    depends_on:
      equipos-db:
        condition: service_healthy

  arriendos-api:
    build:
      context: ./arriendo
      dockerfile: Dockerfile
      target: base
      additional_contexts:
        equipos: ./Equipos  # Para poder acceder a equipos.proto

    restart: always

    environment:
      DATABASE_URL: postgresql://${ARRIENDO_DB_USER}:${ARRIENDO_DB_PASSWORD}@arriendo-db:5432/${ARRIENDO_DB_NAME}
      REDIS_HOST: arriendos-redis
      ACTIVATE_REDIS: ${ACTIVATE_REDIS}
      EQUIPOS_GRPC_URL: "${EQUIPOS_GRPC_URL}"
      GRPC_TIMEOUT_SECONDS: "${GRPC_TIMEOUT_SECONDS}"
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      CLIENT_API_KEY: ${CLIENT_API_KEY}
      PAYMENTS_API_URL: ${PAYMENTS_API_URL:-http://payments-api:8003}
      PAYMENTS_TIMEOUT_SECONDS: ${PAYMENTS_TIMEOUT_SECONDS:-3}
      DELIVERIES_API_URL: ${DELIVERIES_API_URL:-http://entregas-api:8081}
      DELIVERIES_TIMEOUT_SECONDS: ${DELIVERIES_TIMEOUT_SECONDS:-5}
      SAGA_RECOVERY_INTERVAL_SECONDS: ${SAGA_RECOVERY_INTERVAL_SECONDS:-15}

    depends_on:
      arriendo-db:
        condition: service_healthy
      arriendos-redis:
        condition: service_healthy
      payments-api:
        condition: service_healthy

  entregas-api:
    build:
      context: ./Entregas/generated_server
      dockerfile: Dockerfile
      target: base
    restart: always
    environment:
      DATABASE_URL: sqlite:////data/entregas.db
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      CLIENT_API_KEY: ${CLIENT_API_KEY}
      RENTALS_API_URL: http://arriendos-api:8080
      RENTALS_API_KEY: ${ADMIN_API_KEY}
      RENTALS_TIMEOUT_SECONDS: ${RENTALS_TIMEOUT_SECONDS:-5}
      DELIVERIES_ENABLE_FAILURE_INJECTION: ${DELIVERIES_ENABLE_FAILURE_INJECTION:-false}
    volumes:
      - entregas_data:/data
    depends_on:
      arriendos-api:
        condition: service_healthy

  payments-api:
    build:
      context: ./pagos
      dockerfile: Dockerfile
    restart: always
    environment:
      PAYMENTS_DATABASE_URL: postgresql+psycopg://${PAYMENTS_DB_USER}:${PAYMENTS_DB_PASSWORD}@payments-db:5432/${PAYMENTS_DB_NAME}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      RENTALS_API_URL: http://arriendos-api:8080
      RENTALS_API_KEY: ${ADMIN_API_KEY}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-mock}
      PAYMENTS_PROVIDER_MODE: ${PAYMENTS_PROVIDER_MODE:-NORMAL}
      PAYMENTS_PROVIDER_TIMEOUT_SECONDS: ${PAYMENTS_PROVIDER_TIMEOUT_SECONDS:-5}
      PAYMENTS_CIRCUIT_FAILURE_THRESHOLD: ${PAYMENTS_CIRCUIT_FAILURE_THRESHOLD:-3}
      PAYMENTS_CIRCUIT_OPEN_SECONDS: ${PAYMENTS_CIRCUIT_OPEN_SECONDS:-15}
      PAYMENTS_BULKHEAD_CAPACITY: ${PAYMENTS_BULKHEAD_CAPACITY:-5}
      PAYMENTS_TRANSBANK_RETURN_URL: ${PAYMENTS_TRANSBANK_RETURN_URL:-http://localhost:${KRAKEND_PORT:-8080}/payments/transbank/return}
    depends_on:
      payments-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8003/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  payments-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${PAYMENTS_DB_NAME}
      POSTGRES_USER: ${PAYMENTS_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD}
    volumes:
      - payments_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PAYMENTS_DB_USER} -d ${PAYMENTS_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  arriendos-redis:
    image: redis:7-alpine
    restart: always

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  equipos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - equipos_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  arriendo-db:
    image: postgres:16-alpine
    restart: always

    environment:
      POSTGRES_USER: ${ARRIENDO_DB_USER}
      POSTGRES_PASSWORD: ${ARRIENDO_DB_PASSWORD}
      POSTGRES_DB: ${ARRIENDO_DB_NAME}

    volumes:
      - rentals_pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARRIENDO_DB_USER} -d ${ARRIENDO_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  equipos_postgres_data:
  rentals_pg_data:
  payments_pg_data:
  entregas_data:
